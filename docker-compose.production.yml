services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10 }
  api:
    build:
      context: ./backend/src
      dockerfile: CRMSystem.Api/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Brand__Id: ${BRAND_ID}
      Brand__Name: ${BRAND_NAME}
      Brand__LegalName: ${BRAND_LEGAL_NAME}
      Brand__PrimaryColor: ${BRAND_PRIMARY}
      Brand__AccentColor: ${BRAND_ACCENT}
      Brand__SupportEmail: ${BRAND_SUPPORT_EMAIL}
      AllowedHosts: ${ALLOWED_HOSTS}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS_0}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGINS_1:-}
      Cors__AllowedOrigins__2: ${CORS_ALLOWED_ORIGINS_2:-}
      Cors__AllowedOrigins__3: ${CORS_ALLOWED_ORIGINS_3:-}
      Tenancy__Hosts__digitmak__0: ${DIGITMAK_HOST_0:-crm.digitmak.mk}
      Tenancy__Hosts__vezilka__0: ${VEZILKA_HOST_0:-crm.vezilka.mk}
      Tenancy__Hosts__hpc__0: ${HPC_HOST_0:-crm.hpc.mk}
      Tenancy__Hosts__bau__0: ${BAU_HOST_0:-crm.bau.edu.mk}
      # Affiliate brands are path-based on the shared DIGITMAK host in the current production deployment.
      # Their tenant host mappings remain available only when a separate future deployment enables them.
      ConnectionStrings__Portal: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      GOOGLE_FORM_WEBHOOK_SECRET: ${GOOGLE_FORM_WEBHOOK_SECRET}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      MS_CALENDAR_CLIENT_ID: ${MS_CALENDAR_CLIENT_ID:-}
      MS_CALENDAR_CLIENT_SECRET: ${MS_CALENDAR_CLIENT_SECRET:-}
      MS_CALENDAR_TENANT_ID: ${MS_CALENDAR_TENANT_ID:-}
    volumes: [uploads:/var/lib/crm-system/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_started }
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav_data:/var/lib/clamav]
  frontend:
    build:
      context: ./frontend
      args:
        # The frontend resolves the brand from window.location.hostname at runtime.
        # These values remain as a local/static fallback.
        VITE_BRAND_ID: ${BRAND_ID}
        VITE_BRAND_NAME: ${BRAND_NAME}
        VITE_BRAND_LEGAL_NAME: ${BRAND_LEGAL_NAME}
        VITE_BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
        VITE_BRAND_FOOTER_LOGO_URL: ${BRAND_FOOTER_LOGO_URL:-}
        VITE_BRAND_PRIMARY: ${BRAND_PRIMARY}
        VITE_BRAND_ACCENT: ${BRAND_ACCENT}
        VITE_BRAND_SURFACE: ${BRAND_SURFACE}
        VITE_BRAND_WEBSITE: ${BRAND_WEBSITE}
        VITE_BRAND_SUPPORT_EMAIL: ${BRAND_SUPPORT_EMAIL}
    restart: unless-stopped
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    environment:
      PORTAL_DOMAINS: ${PORTAL_DOMAINS:-crm.digitmak.mk}
      TLS_PRIMARY_DOMAIN: ${TLS_PRIMARY_DOMAIN:-crm.digitmak.mk}
      NGINX_ENVSUBST_FILTER: PORTAL_DOMAINS TLS_PRIMARY_DOMAIN
    volumes:
      # This server already runs a shared reverse proxy (owned by another team
      # member) that occupies host ports 80/443 and terminates TLS for every
      # site on this box, including this one. So our own nginx binds to 8080
      # only (see "ports" above) and stays HTTP-only — it does NOT try to get
      # its own certificate. Ask whoever manages that shared proxy to route
      # crm.digitmak.mk to this server's port 8080. If this project ever moves
      # to its own dedicated server instead, switch this line to
      # ./deploy/nginx/portal.conf.template (the HTTPS-enforcing config with
      # its own Let's Encrypt certificate via deploy/init-tls.sh) and restore
      # the 80:80 / 443:443 ports above.
      - ./deploy/nginx/portal-bootstrap.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on: [api, frontend]
  certbot:
    image: certbot/certbot:latest
    # Certbot runs only on-demand. Host networking lets init-tls.sh use port 80
    # without publishing a permanent Docker port that conflicts with nginx.
    network_mode: host
    volumes: [letsencrypt:/etc/letsencrypt, certbot_www:/var/www/certbot]
volumes: { postgres_data: {}, uploads: {}, letsencrypt: {}, certbot_www: {}, clamav_data: {} }
