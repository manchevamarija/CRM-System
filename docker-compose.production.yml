services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10 }
  api:
    build:
      context: ./backend/src
      dockerfile: CRMSystem.Api/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Brand__Id: ${BRAND_ID}
      Brand__Name: ${BRAND_NAME}
      Brand__LegalName: ${BRAND_LEGAL_NAME}
      Brand__PrimaryColor: ${BRAND_PRIMARY}
      Brand__AccentColor: ${BRAND_ACCENT}
      Brand__SupportEmail: ${BRAND_SUPPORT_EMAIL}
      ConnectionStrings__Portal: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes: [uploads:/var/lib/crm-system/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_started }
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav_data:/var/lib/clamav]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BRAND_ID: ${BRAND_ID}
        VITE_BRAND_NAME: ${BRAND_NAME}
        VITE_BRAND_LEGAL_NAME: ${BRAND_LEGAL_NAME}
        VITE_BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
        VITE_BRAND_FOOTER_LOGO_URL: ${BRAND_FOOTER_LOGO_URL:-}
        VITE_BRAND_PRIMARY: ${BRAND_PRIMARY}
        VITE_BRAND_ACCENT: ${BRAND_ACCENT}
        VITE_BRAND_SURFACE: ${BRAND_SURFACE}
        VITE_BRAND_WEBSITE: ${BRAND_WEBSITE}
        VITE_BRAND_SUPPORT_EMAIL: ${BRAND_SUPPORT_EMAIL}
    restart: unless-stopped
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal.crm-system.mk}
      NGINX_ENVSUBST_FILTER: PORTAL_DOMAIN
    volumes:
      - ./deploy/nginx/portal.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on: [api, frontend]
  certbot:
    image: certbot/certbot:latest
    ports: ["80:80"]
    volumes: [letsencrypt:/etc/letsencrypt, certbot_www:/var/www/certbot]
volumes: { postgres_data: {}, uploads: {}, letsencrypt: {}, certbot_www: {}, clamav_data: {} }
